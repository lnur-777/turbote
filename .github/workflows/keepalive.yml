name: Keep Render Awake

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render service
        env:
          CUSTOM_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -n "$CUSTOM_URL" ]; then
            curl -fsS --max-time 45 "${CUSTOM_URL%/}/health" || true
          else
            curl -fsS --max-time 45 "https://turbote.onrender.com/health" || true
          fi
