services:
  - type: web
    name: turboaz-bot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CHECK_INTERVAL_SEC
        value: "60"
      - key: NEW_ONLY
        value: "true"
